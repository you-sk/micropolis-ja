HIGH_POLLUTION.title = 汚染警報
HIGH_POLLUTION.detail = 都市の汚染がMicropolis汚染対策局の許容限度を超えています。生態系に重大な影響が及ぶおそれがあります。<br><br>環境を改善するか、市役所で防毒マスクの販売を始めてください。
HIGH_CRIME.title = 犯罪警報
HIGH_CRIME.detail = 都市の犯罪を抑えられなくなっています。怒った群衆が中心部で略奪や破壊行為に及んでいます。解決できなければ、大統領が間もなく州兵を送り込むでしょう。
HIGH_TRAFFIC.title = 渋滞警告
HIGH_TRAFFIC.detail = 都市の交通事情が悪化しています。身動きの取れない渋滞が広がり、通勤者は怒りを募らせています。<br><br>道路や線路を増やすか、防弾仕様のリムジンを手配してください。
FIRE_REPORT.title = 火災の報告
FIRE_REPORT.detail = 火災の発生が報告されました！
MONSTER_REPORT.title = 怪獣の襲撃
MONSTER_REPORT.detail = 水中に巨大な爬虫類のような生物が見つかりました。汚染の激しい地域に引き寄せられているようです。移動した先々が破壊されています。<br>立ち去るまで待って、がれきの中から街を再建するしかありません。
TORNADO_REPORT.title = 竜巻警報
TORNADO_REPORT.detail = 竜巻が報告されました！ 食い止める手段はありません。災害後の復旧作業に備えましょう。
EARTHQUAKE_REPORT.title = 地震
EARTHQUAKE_REPORT.detail = 大規模な地震が発生しました！ 延焼する前に火を消してください。その後、送電網を復旧して都市を再建しましょう。
PLANECRASH_REPORT.title = 飛行機の墜落
PLANECRASH_REPORT.detail = 飛行機が墜落しました！
SHIPWRECK_REPORT.title = 船の難破
SHIPWRECK_REPORT.detail = 船が難破しました！
TRAIN_CRASH_REPORT.title = 列車事故
TRAIN_CRASH_REPORT.detail = 列車事故が発生しました！
COPTER_CRASH_REPORT.title = ヘリコプターの墜落
COPTER_CRASH_REPORT.detail = ヘリコプターが墜落しました！
FIREBOMBING_REPORT.title = 焼夷弾攻撃の報告
FIREBOMBING_REPORT.detail = 焼夷弾が降り注いでいます！
POP_2K_REACHED.title = 町
POP_2K_REACHED.detail = おめでとうございます。村が町へと発展しました。人口は2,000人です。
POP_10K_REACHED.title = 都市
POP_10K_REACHED.detail = 町が一人前の都市へと発展しました。現在の人口は10,000人です。この調子で取り組みましょう！
POP_50K_REACHED.title = 首都
POP_50K_REACHED.detail = 都市が首都の段階に達しました。現在の人口は50,000人です。政治家としても有望な未来が待っています。
POP_100K_REACHED.title = 大都市
POP_100K_REACHED.detail = 首都が大都市へと発展しました。現在の人口は100,000人です。その経営手腕なら、知事への立候補を真剣に考えてもよいでしょう。
POP_500K_REACHED.title = 巨大都市
POP_500K_REACHED.detail = おめでとうございます。都市発展の最上位に当たる巨大都市に到達しました。
HEAVY_TRAFFIC_REPORT.title = 激しい渋滞
HEAVY_TRAFFIC_REPORT.detail = 上空監視1号より<br>激しい渋滞を報告します！
FLOOD_REPORT.title = 洪水の報告
FLOOD_REPORT.detail = 水辺で洪水が報告されました！
MELTDOWN_REPORT.title = 原子炉のメルトダウン
MELTDOWN_REPORT.detail = 発電所で原子炉のメルトダウンが発生しました。放射性同位体が崩壊するまで、この地域への立ち入りを避けてください。<br><br>この問題は何世代にもわたって続きます。すぐに解決するとは期待しないでください。
RIOTING_REPORT.title = 暴動
RIOTING_REPORT.detail = 住民が路上で暴動を起こしています。車や家に放火し、政府庁舎や商店に爆弾を投げています！<br><br>報道がすべて封じられる一方、ファシストの警官たちが貧しい住民を殴って服従させています。
