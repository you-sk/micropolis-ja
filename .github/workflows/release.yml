name: Release

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Clean build directory
        run: mvn -B clean
      - name: Build Windows SPC decoder
        shell: pwsh
        run: ./scripts/build-spc.ps1
      - name: Build with Maven
        run: mvn -B package
      - name: Archive corresponding source
        run: git archive --format=zip --prefix=micropolis-source/ --output=target/micropolis-source.zip HEAD
      - name: Upload JAR to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/*-dist.zip
            target/micropolis-source.zip
            LICENSE
            NOTICE
            README.md
