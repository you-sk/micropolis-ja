name: Java CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Build with Maven
        run: mvn -B clean package

  windows-spc:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Clean build directory
        run: mvn -B clean
      - name: Build SPC decoder
        shell: pwsh
        run: ./scripts/build-spc.ps1
      - name: Test and package including native SPC decoder
        run: mvn -B package
